server.modules = ( "mod_accesslog", "mod_auth", "mod_fastcgi", "mod_setenv" )

server.document-root = "/none"
server.port = env.LIGHTTPD_PORT
server.errorlog = "/dev/fd/2"

accesslog.format = env.LIGHTTPD_ACCESSLOG_FORMAT
accesslog.filename = "/dev/fd/2"

# QGIS Server builds the request URL (used for example in the OGC API links) with the scheme
# taken from the HTTPS environment variable, propagate the protocol set by the reverse proxy.
$HTTP["x-forwarded-proto"] =~ "https" {
    setenv.add-environment = ("HTTPS" => "on")
}

include_shell "./gen-server"
